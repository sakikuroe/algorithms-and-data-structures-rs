[package]
name = "anmitsu"
version = "0.1.0"
edition = "2024"

# bundled 版は tools/bundle.py が生成する成果物であり、リポジトリーには含めない。
# 通常のビルドで解決されると生成前のクリーンチェックアウトで失敗するため、
# この feature を有効にしたときだけビルド対象になるようにしている。
[features]
bundled = []

[dependencies]
rand = "0.9.1"

[[bin]]
name = "lc-cycle-detection"
path = "src/bin/library_checker/cycle_detection.rs"

[[bin]]
name = "lc-cycle-detection-bundled"
path = "src/bin/library_checker/bundled/cycle_detection.rs"
required-features = ["bundled"]

